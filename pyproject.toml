[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "process-atlas"
version = "0.1.0"
description = "Event log -> deterministic process discovery (DFG, variants, bottlenecks) rendered as a zero-CDN single-file HTML"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = []

[project.scripts]
process-atlas = "process_atlas.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
