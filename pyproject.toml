[build-system]
# PEP 639 SPDX `license = "..."` needs setuptools >= 77, which is >= 3.9 only,
# so build-system floor and requires-python are raised together (DEC1 = B).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "process-atlas"
version = "0.2.0"
description = "Event log -> deterministic process discovery (DFG, variants, bottlenecks) rendered as a zero-CDN single-file HTML"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.scripts]
process-atlas = "process_atlas.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "install_surface: opt-in wheel-install contract check (needs network + a scratch venv; set PROCESS_ATLAS_INSTALL_SURFACE=1)",
]
